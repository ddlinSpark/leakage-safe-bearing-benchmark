[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "spindle-cnn"
version = "0.2.0"
description = "Leakage-safe bearing fault diagnosis benchmark"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dynamic = ["dependencies"]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6"]

[project.scripts]
spindle-build-raw = "spindle_cnn.data.build_dataset_from_raw:main"
spindle-build-stft = "spindle_cnn.data.build_final_dataset_with_stft:main"
spindle-build-windows = "spindle_cnn.data.build_window_sample_index:main"
spindle-train-backbone = "spindle_cnn.final.train_cwt_residual_attention_compare:main"
spindle-train-calibrator = "spindle_cnn.final.train_logit_calibrator:main"
spindle-self-train = "spindle_cnn.final.self_train_relabel:main"
spindle-postprocess = "spindle_cnn.final.postprocess_cwt_calibration:main"
spindle-predict = "spindle_cnn.final.predict:main"
spindle-check-gpu = "spindle_cnn.environment.check_gpu:main"
spindle-cwru-download = "spindle_cnn.public_benchmark.download_cwru:main"
spindle-cwru-cache = "spindle_cnn.public_benchmark.cwru_data:main"
spindle-cwru-benchmark = "spindle_cnn.public_benchmark.train_cwru:main"
spindle-pu-cache = "spindle_cnn.public_benchmark.pu_data:main"
spindle-public-summary = "spindle_cnn.public_benchmark.analyze_results:main"
spindle-pu-prepare = "spindle_cnn.public_benchmark.prepare_paderborn:main"
spindle-public-figures = "spindle_cnn.public_benchmark.make_figures:main"
spindle-build-sci-paper = "spindle_cnn.document_tools.build_sci_revision:main"
spindle-model-complexity = "spindle_cnn.public_benchmark.benchmark_models:main"
spindle-benchmark = "spindle_cnn.experiments.run_benchmark:main"
spindle-ablation = "spindle_cnn.experiments.run_ablation:main"
spindle-threshold-sweep = "spindle_cnn.experiments.run_threshold:main"
spindle-statistical-analysis = "spindle_cnn.analysis.statistics:main"
spindle-publication-figures = "spindle_cnn.experiments.make_figures:main"

[tool.setuptools.dynamic]
dependencies = { file = ["requirements.txt"] }

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py310"
line-length = 100
