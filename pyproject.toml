[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "leakage-safe-bearing-benchmark"
version = "0.3.0"
description = "Leakage-safe bearing fault diagnosis benchmark"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dynamic = ["dependencies"]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6"]

[project.scripts]
spindle-check-gpu = "spindle_cnn.environment.check_gpu:main"
spindle-cwru-download = "spindle_cnn.public_benchmark.download_cwru:main"
spindle-cwru-cache = "spindle_cnn.public_benchmark.cwru_data:main"
spindle-pu-cache = "spindle_cnn.public_benchmark.pu_data:main"
spindle-pu-raw-cache = "spindle_cnn.public_benchmark.paderborn_raw_windows:main"
spindle-cwt-sensitivity = "spindle_cnn.public_benchmark.cwt_sensitivity:main"
spindle-pu-prepare = "spindle_cnn.public_benchmark.prepare_paderborn:main"
spindle-benchmark = "spindle_cnn.experiments.run_benchmark:main"
spindle-ablation = "spindle_cnn.experiments.run_ablation:main"
spindle-threshold-sweep = "spindle_cnn.experiments.run_threshold:main"
spindle-cwt-run = "spindle_cnn.experiments.run_cwt_sensitivity:main"
spindle-normalization-run = "spindle_cnn.experiments.run_normalization_sensitivity:main"
spindle-statistical-analysis = "spindle_cnn.analysis.statistics:main"
spindle-hierarchical-statistics = "spindle_cnn.analysis.hierarchical:main"
spindle-export-results-report = "spindle_cnn.analysis.report:main"
spindle-recheck-run = "spindle_cnn.analysis.recheck_run:main"
spindle-analyze-sota = "spindle_cnn.analysis.sota:main"
spindle-audit-protocol = "spindle_cnn.analysis.protocol_audit:main"
spindle-domain-shift = "spindle_cnn.analysis.domain_shift:main"
spindle-label-granularity = "spindle_cnn.analysis.label_granularity:main"
spindle-calibration-audit = "spindle_cnn.analysis.calibration_audit:main"
spindle-training-sanity = "spindle_cnn.analysis.training_sanity:main"
spindle-training-budget = "spindle_cnn.analysis.training_budget:main"
spindle-baseline-tuning = "spindle_cnn.analysis.baseline_tuning:main"
spindle-self-training-analysis = "spindle_cnn.analysis.self_training:main"
spindle-foldwise = "spindle_cnn.analysis.foldwise:main"
spindle-feature-space = "spindle_cnn.analysis.feature_space:main"
spindle-method-figures = "spindle_cnn.experiments.make_method_figures:main"
spindle-publication-figures = "spindle_cnn.experiments.make_figures:main"
spindle-build-paper = "spindle_cnn.paper.build_docx:main"

[tool.setuptools.dynamic]
dependencies = { file = ["requirements.txt"] }

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
