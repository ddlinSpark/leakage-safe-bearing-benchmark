[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "spindle-cnn"
version = "0.2.0"
description = "Leakage-safe bearing fault diagnosis benchmark"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dynamic = ["dependencies"]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6"]

[project.scripts]
spindle-check-gpu = "spindle_cnn.environment.check_gpu:main"
spindle-cwru-download = "spindle_cnn.public_benchmark.download_cwru:main"
spindle-cwru-cache = "spindle_cnn.public_benchmark.cwru_data:main"
spindle-pu-cache = "spindle_cnn.public_benchmark.pu_data:main"
spindle-pu-prepare = "spindle_cnn.public_benchmark.prepare_paderborn:main"
spindle-benchmark = "spindle_cnn.experiments.run_benchmark:main"
spindle-ablation = "spindle_cnn.experiments.run_ablation:main"
spindle-threshold-sweep = "spindle_cnn.experiments.run_threshold:main"
spindle-statistical-analysis = "spindle_cnn.analysis.statistics:main"
spindle-export-results-report = "spindle_cnn.analysis.report:main"
spindle-recheck-run = "spindle_cnn.analysis.recheck_run:main"
spindle-method-figures = "spindle_cnn.experiments.make_method_figures:main"
spindle-publication-figures = "spindle_cnn.experiments.make_figures:main"
spindle-build-paper = "spindle_cnn.paper.build_docx:main"

[tool.setuptools.dynamic]
dependencies = { file = ["requirements.txt"] }

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py310"
line-length = 100
